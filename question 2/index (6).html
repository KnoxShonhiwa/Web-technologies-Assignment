<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Admission Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header class="form-header">
            <h1>Student Admission Form</h1>
            <p>College Admission Registration</p>
        </header>

        <form>

            <!-- Personal information -->
            <fieldset>
                <legend>Personal Information</legend>

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your full name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter email" required>

                <label for="phone">Mobile Number:</label>
                <input type="tel" id="phone"
                       placeholder="Enter mobile number">

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob">

                <label>Gender:</label>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="gender" value="male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="female">
                        Female
                    </label>
                </div>
            </fieldset>

            <!-- Course details -->
            <fieldset>
                <legend>Course Information</legend>

                <label for="course">Select Course:</label>

                <select id="course">
                    <option>B.Sc Computer Science</option>
                    <option>BCA</option>
                    <option>B.Tech Information Technology</option>
                    <option>B.Sc Data Science</option>
                </select>

                <label for="marks">12th Percentage:</label>

                <input type="number" id="marks"
                       min="0" max="100"
                       placeholder="Enter percentage">

                <label>Programming Skills:</label>

                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" value="java">
                        Java
                    </label>

                    <label>
                        <input type="checkbox" value="python">
                        Python
                    </label>

                    <label>
                        <input type="checkbox" value="javascript">
                        JavaScript
                    </label>
                </div>
            </fieldset>

            <!-- Address -->
            <fieldset>
                <legend>Address</legend>

                <label for="address">Address:</label>

                <textarea id="address"
                          rows="5"
                          placeholder="Enter your address"></textarea>
            </fieldset>

            <!-- Media elements -->
            <fieldset>
                <legend>College Information</legend>

                <h3>College Campus</h3>

                <!-- Place college.jpg in the media folder -->
                <img src="media/college.jpg"
                     alt="College Campus"
                     class="college-image">

                <h3>College Introduction Video</h3>

                <!-- Place college-video.mp4 in the media folder -->
                <video controls class="media">
                    <source src="media/college-video.mp4"
                            type="video/mp4">
                    Your browser does not support video.
                </video>

                <h3>College Introduction Audio</h3>

                <!-- Place college-audio.mp3 in the media folder -->
                <audio controls>
                    <source src="media/college-audio.mp3"
                            type="audio/mpeg">
                    Your browser does not support audio.
                </audio>
            </fieldset>

            <!-- Buttons -->
            <div class="button-area">
                <button type="submit">Submit Application</button>
                <button type="reset">Reset</button>
            </div>

        </form>

    </div>

</body>
</html>
